<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>New Muslim Companion — App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS — manuscript palette: paper, ink, lapis, gold leaf
   ============================================================ */
:root {
  --bg:#F2F1E7; --surface:#FBFAF3; --surface-2:#E7E8DA;
  --ink:#22302A; --muted:#6C7970;
  --lapis:#3E6B52; --lapis-ink:#3E6B52; --lapis-soft:rgba(62,107,82,.11);
  --gold:#96793A; --gold-soft:rgba(150,121,58,.13);
  --line:rgba(34,48,42,.13);
  --accent:var(--lapis);
  --shadow:0 1px 2px rgba(34,48,42,.05), 0 8px 24px rgba(34,48,42,.07);
  --r-sm:12px; --r:18px; --r-lg:26px;
  --tap:48px;
}
[data-theme="night"] {
  --bg:#131A16; --surface:#1C2620; --surface-2:#25322B;
  --ink:#E8E6D8; --muted:#93A093;
  --lapis:#84B294; --lapis-ink:#84B294; --lapis-soft:rgba(132,178,148,.15);
  --gold:#C6A662; --gold-soft:rgba(198,166,98,.15);
  --line:rgba(232,230,216,.13);
  --shadow:0 1px 2px rgba(0,0,0,.28), 0 12px 32px rgba(0,0,0,.32);
}
[data-persona="child"] { --accent:#B96F3E; }
[data-theme="night"][data-persona="child"] { --accent:#DFA06C; }

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#0D1310;
  font-family:'Manrope',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:24px 12px;
  -webkit-font-smoothing:antialiased;
}
@media (max-width:480px){ body{padding:0} }

/* ============================================================
   FRAME
   ============================================================ */
.app{
  width:100%;max-width:412px;height:844px;max-height:100vh;
  background:var(--bg);color:var(--ink);
  border-radius:34px;overflow:hidden;position:relative;
  display:flex;flex-direction:column;
  box-shadow:0 40px 90px rgba(0,0,0,.5);
  transition:background .5s ease,color .3s ease;
}
@media (max-width:480px){ .app{border-radius:0;height:100vh} }
.app[dir="rtl"]{ font-family:'IBM Plex Sans Arabic','Manrope',sans-serif; }

.statusbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 24px 2px;font-size:12px;font-weight:600;
  font-variant-numeric:tabular-nums;color:var(--ink);flex-shrink:0;
}
.statusbar svg{opacity:.75}

/* ============================================================
   TYPE
   ============================================================ */
.display{ font-family:'Fraunces',Georgia,serif; font-weight:600; letter-spacing:-.01em; }
.ar{ font-family:'Amiri',serif; }
.eyebrow{
  font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);
}
.app[dir="rtl"] .eyebrow{ letter-spacing:0;font-size:12px }

/* ============================================================
   SCREENS
   ============================================================ */
.screen{ display:none;flex:1;flex-direction:column;min-height:0; }
.screen.on{ display:flex;animation:fade .28s ease both; }
@keyframes fade{ from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
.scroll{ flex:1;overflow-y:auto;overscroll-behavior:contain; }
.scroll::-webkit-scrollbar{width:0}

/* ============================================================
   ONBOARDING
   ============================================================ */
.onb-head{ padding:22px 26px 6px; }
.steps{ display:flex;gap:6px;margin-bottom:26px; }
.steps i{ height:3px;flex:1;border-radius:2px;background:var(--line); }
.steps i.done{ background:var(--accent); }
.onb-head h1{ font-size:29px;line-height:1.12;margin-bottom:10px; }
.onb-head p{ font-size:14px;line-height:1.6;color:var(--muted);max-width:31ch; }

.choices{ padding:18px 22px 8px;display:flex;flex-direction:column;gap:9px; }
.choice{
  display:flex;align-items:center;gap:15px;width:100%;
  min-height:var(--tap);
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:13px 16px;cursor:pointer;
  font-family:inherit;color:var(--ink);text-align:start;
  transition:border-color .16s,transform .16s,box-shadow .16s;
}
.choice:hover{ border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow); }
.choice:focus-visible{ outline:2px solid var(--accent);outline-offset:3px; }
.choice .mark{
  width:42px;height:42px;flex-shrink:0;border-radius:13px;
  background:var(--lapis-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:12.5px;letter-spacing:.06em;
}
.choice .mark.ar{ font-size:19px;letter-spacing:0; }
.choice .t1{ font-size:15.5px;font-weight:600; }
.choice .t2{ font-size:12.5px;color:var(--muted);margin-top:2px; }
.choice .arrow{ margin-inline-start:auto;color:var(--muted);flex-shrink:0; }
.app[dir="rtl"] .choice .arrow{ transform:scaleX(-1); }

.note{
  margin:12px 26px 26px;font-size:12.5px;line-height:1.65;color:var(--muted);
  padding-top:14px;border-top:1px solid var(--line);
}
.note .ar{ color:var(--gold);font-size:14.5px; }

/* persona cards — mihrab arch */
.arches{ display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:8px 22px 0; }
.arch{
  background:var(--surface);border:1px solid var(--line);
  border-radius:74px 74px var(--r-sm) var(--r-sm);
  padding:20px 6px 14px;text-align:center;cursor:pointer;
  font-family:inherit;color:var(--ink);
  transition:border-color .16s,transform .16s,box-shadow .16s;
}
.arch:hover{ border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow); }
.arch:focus-visible{ outline:2px solid var(--accent);outline-offset:3px; }
.arch .p-ic{
  width:38px;height:38px;margin:0 auto 9px;border-radius:50%;
  background:var(--lapis-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;
}
.arch .p-ic svg{width:20px;height:20px}
.arch .p-ar{ font-family:'Amiri',serif;font-size:15px;color:var(--gold);display:block;line-height:1.3; }
.arch .p-en{ font-size:11.5px;color:var(--muted);display:block;margin-top:2px; }
.back{
  display:inline-flex;align-items:center;gap:6px;
  background:none;border:none;color:var(--muted);
  font-family:inherit;font-size:13px;cursor:pointer;
  padding:14px 24px 0;min-height:44px;
}
.back:hover{color:var(--ink)}
.app[dir="rtl"] .back svg{transform:scaleX(-1)}

/* ============================================================
   HOME
   ============================================================ */
.h-top{
  display:flex;align-items:flex-start;gap:12px;
  padding:16px 22px 0;
}
.h-top .greet-ar{ font-family:'Amiri',serif;font-size:23px;line-height:1.25; }
.h-top .greet-sub{ font-size:12.5px;color:var(--muted);margin-top:2px; }
.icon-btn{
  margin-inline-start:auto;width:40px;height:40px;flex-shrink:0;
  border-radius:12px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:border-color .16s;
}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn svg{width:19px;height:19px}

/* ---- SIGNATURE: the prayer arc ---- */
.arc-card{
  margin:14px 22px 0;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-lg);
  padding:18px 20px 14px;box-shadow:var(--shadow);
}
.arc-head{ display:flex;align-items:baseline;gap:10px;margin-bottom:2px; }
.arc-head .now-name{ font-family:'Amiri',serif;font-size:27px;color:var(--gold);line-height:1.1; }
.arc-head .now-in{
  margin-inline-start:auto;font-size:13px;font-weight:600;
  font-variant-numeric:tabular-nums;
}
.arc-head .now-in b{ color:var(--accent) }
.arc-sub{ font-size:12px;color:var(--muted);margin-bottom:14px }
.arc-wrap{ position:relative;height:56px;margin:0 2px }
.arc-svg{ width:100%;height:100%;overflow:visible;display:block }
.arc-labels{ display:flex;justify-content:space-between;margin-top:2px }
.arc-labels span{
  font-size:10.5px;color:var(--muted);flex:1;text-align:center;
  font-variant-numeric:tabular-nums;
}
.arc-labels span.is-now{ color:var(--gold);font-weight:700 }

/* ---- sections ---- */
.sec{ padding:22px 22px 0 }
.sec-h{ display:flex;align-items:baseline;margin-bottom:10px }
.sec-h .ar-lab{ margin-inline-start:auto;font-family:'Amiri',serif;font-size:15px;color:var(--gold);opacity:.75 }

/* resume card */
.resume{
  display:flex;align-items:center;gap:14px;width:100%;
  background:linear-gradient(135deg,var(--lapis-soft),transparent 70%),var(--surface);
  border:1px solid var(--line);border-radius:var(--r);
  padding:15px 16px;cursor:pointer;font-family:inherit;color:var(--ink);text-align:start;
  transition:border-color .16s,transform .16s;
}
.resume:hover{ border-color:var(--accent);transform:translateY(-1px) }
.resume .ring{ width:46px;height:46px;flex-shrink:0;position:relative }
.resume .ring svg{ width:46px;height:46px;transform:rotate(-90deg) }
.resume .ring span{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;
}
.resume .r-t1{ font-size:14.5px;font-weight:600 }
.resume .r-t2{ font-size:12px;color:var(--muted);margin-top:2px }
.resume .go{ margin-inline-start:auto;color:var(--accent) }
.app[dir="rtl"] .resume .go{transform:scaleX(-1)}

/* feature tiles */
.tiles{ display:grid;grid-template-columns:1fr 1fr;gap:10px }
.tile{
  position:relative;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:14px;cursor:pointer;
  font-family:inherit;color:var(--ink);text-align:start;
  min-height:104px;display:flex;flex-direction:column;
  transition:border-color .16s,transform .16s,box-shadow .16s;
}
.tile:hover{ border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow) }
.tile:focus-visible{ outline:2px solid var(--accent);outline-offset:3px }
.tile .t-ic{
  width:36px;height:36px;border-radius:11px;
  background:var(--lapis-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;margin-bottom:auto;
}
.tile .t-ic svg{width:19px;height:19px}
.tile .t-name{ font-size:13.5px;font-weight:600;margin-top:10px;line-height:1.3 }
.tile .t-desc{ font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45 }
.tile .t-ar{
  position:absolute;top:14px;inset-inline-end:14px;
  font-family:'Amiri',serif;font-size:14px;color:var(--gold);opacity:.7;
}
.tile.span2{ grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;min-height:0 }
.tile.span2 .t-ic{ width:44px;height:44px;margin-bottom:0;flex-shrink:0 }
.tile.span2 .t-name{ margin-top:0 }
.tile.lead{
  border-color:color-mix(in srgb,var(--gold) 45%,transparent);
  background:linear-gradient(135deg,var(--gold-soft),transparent 65%),var(--surface);
}
.tile .badge{
  align-self:flex-start;margin-top:8px;
  font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);
  border-radius:20px;padding:3px 9px;
}
.tile.span2 .badge{ margin:0;margin-inline-start:auto }
.app[dir="rtl"] .tile .badge{letter-spacing:0}

/* ============================================================
   TAB BAR
   ============================================================ */
.tabbar{
  display:flex;align-items:flex-end;flex-shrink:0;
  border-top:1px solid var(--line);background:var(--surface);
  padding:8px 6px 6px;
}
.tabbar button{
  flex:1;min-height:var(--tap);
  display:flex;flex-direction:column;align-items:center;gap:4px;
  background:none;border:none;cursor:pointer;font-family:inherit;
  font-size:10.5px;font-weight:600;color:var(--muted);padding:4px 0;
}
.tabbar button svg{width:21px;height:21px}
.tabbar button.on{ color:var(--accent) }
.tabbar .fab-wrap{ flex:1;display:flex;flex-direction:column;align-items:center;gap:4px }
.tabbar .fab{
  width:46px;height:46px;border-radius:16px;margin-top:-16px;
  background:var(--accent);color:var(--surface);
  display:flex;align-items:center;justify-content:center;
  font-family:'Amiri',serif;font-size:22px;font-weight:700;
  box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 35%,transparent);
}
[data-theme="night"] .tabbar .fab{ color:#131A16 }
.bar-ind{ width:126px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 8px;flex-shrink:0 }

/* ============================================================
   RASHED
   ============================================================ */
.chat-top{
  display:flex;align-items:center;gap:13px;flex-shrink:0;
  padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface);
}
.chat-top .av{
  width:42px;height:42px;border-radius:14px;flex-shrink:0;
  background:var(--gold-soft);color:var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-family:'Amiri',serif;font-size:22px;font-weight:700;
}
.chat-top .c1{ font-size:15px;font-weight:600 }
.chat-top .c2{ font-size:11.5px;color:var(--muted);margin-top:1px }
.chat-top .close{
  margin-inline-start:auto;width:38px;height:38px;border-radius:11px;
  border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.chat-body{ flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:11px }
.bubble{ max-width:85%;border-radius:20px;padding:12px 15px;font-size:13.5px;line-height:1.62 }
.bubble.me{
  align-self:flex-end;background:var(--accent);color:var(--surface);
  border-end-end-radius:6px;
}
[data-theme="night"] .bubble.me{ color:#131A16 }
.bubble.me .ar{ font-size:16px }
.bubble.bot{
  align-self:flex-start;background:var(--surface);border:1px solid var(--line);
  border-end-start-radius:6px;
}
.srcs{ display:flex;flex-direction:column;gap:8px;margin-top:12px }
.srcs .lab{ font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted) }
.app[dir="rtl"] .srcs .lab{letter-spacing:0}
.src{
  display:flex;align-items:center;gap:10px;min-height:46px;
  border:1px solid var(--line);border-radius:14px;background:var(--surface-2);
  padding:9px 12px;text-decoration:none;color:var(--ink);
  transition:border-color .15s;
}
.src:hover{ border-color:var(--accent) }
.src .s-i{
  width:28px;height:28px;border-radius:9px;flex-shrink:0;
  background:var(--lapis-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
}
.src .s-n{ font-size:12.5px;font-weight:600 }
.src .s-d{ font-size:10.5px;color:var(--muted);margin-top:1px }
.src .s-g{ margin-inline-start:auto;color:var(--muted) }
.fine{ font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:11px;padding-top:11px;border-top:1px solid var(--line) }
.chips{ display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 10px;flex-shrink:0 }
.chip{
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:22px;padding:9px 14px;min-height:40px;
  font-family:'Amiri',serif;font-size:14px;cursor:pointer;
}
.chip:hover{ border-color:var(--accent);color:var(--accent) }
.composer{
  display:flex;gap:9px;padding:10px 16px 14px;flex-shrink:0;
  border-top:1px solid var(--line);background:var(--surface);
}
.composer input{
  flex:1;min-height:var(--tap);background:var(--bg);
  border:1px solid var(--line);border-radius:24px;padding:12px 18px;
  color:var(--ink);font-family:inherit;font-size:13.5px;
}
.composer input:focus{ outline:none;border-color:var(--accent) }
.composer button{
  width:var(--tap);height:var(--tap);border-radius:50%;flex-shrink:0;
  background:var(--accent);color:var(--surface);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
[data-theme="night"] .composer button{ color:#131A16 }
.app[dir="rtl"] .composer button svg{ transform:scaleX(-1) }

/* ============================================================
   SETTINGS SHEET
   ============================================================ */
.sheet-bg{
  position:absolute;inset:0;background:rgba(13,19,16,.45);
  opacity:0;pointer-events:none;transition:opacity .22s;z-index:20;
}
.sheet-bg.on{ opacity:1;pointer-events:auto }
.sheet{
  position:absolute;inset-inline:0;bottom:0;z-index:21;
  background:var(--bg);border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:10px 22px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -10px 40px rgba(0,0,0,.2);
}
.sheet.on{ transform:none }
.sheet .grab{ width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px }
.sheet h3{ font-size:19px;margin-bottom:14px }
.row{
  display:flex;align-items:center;gap:12px;min-height:var(--tap);
  padding:11px 0;border-bottom:1px solid var(--line);
}
.row:last-of-type{border-bottom:none}
.row .r-lab{ font-size:14px;font-weight:500 }
.row .r-val{ margin-inline-start:auto;display:flex;gap:6px }
.pill{
  border:1px solid var(--line);background:var(--surface);color:var(--muted);
  border-radius:20px;padding:8px 13px;font-family:inherit;font-size:12.5px;
  cursor:pointer;min-height:38px;
}
.pill.on{ border-color:var(--accent);color:var(--accent);background:var(--lapis-soft);font-weight:600 }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.01ms!important;transition-duration:.01ms!important }
}
</style>
</head>
<body>
<div class="app" id="app" data-theme="day" data-persona="new" dir="ltr">

  <div class="statusbar">
    <span>9:41</span>
    <svg width="44" height="11" viewBox="0 0 46 11" fill="none" stroke="currentColor" stroke-width="1">
      <rect x="1" y="7" width="2" height="3" fill="currentColor"/><rect x="5" y="5" width="2" height="5" fill="currentColor"/><rect x="9" y="3" width="2" height="7" fill="currentColor"/><rect x="13" y="1" width="2" height="9" fill="currentColor" opacity=".35"/>
      <path d="M22 8a6 6 0 0 1 8 0"/><path d="M20 5.6a9 9 0 0 1 12 0"/><circle cx="26" cy="9.6" r="1" fill="currentColor" stroke="none"/>
      <rect x="35" y="2" width="9" height="7" rx="1.6"/><rect x="36.2" y="3.2" width="5.5" height="4.6" rx=".8" fill="currentColor" stroke="none"/><path d="M45 4.5v2"/>
    </svg>
  </div>

  <!-- ============ 1. LANGUAGE ============ -->
  <section class="screen on" id="s-lang">
    <div class="scroll">
      <div class="onb-head">
        <div class="steps"><i class="done"></i><i></i></div>
        <h1 class="display">Choose your language</h1>
        <p>So every Arabic word you learn has a clear explanation beside it.</p>
      </div>
      <div class="choices" id="langList"></div>
      <p class="note">Prayer and Qur'an stay in <span class="ar">العربية</span>. Your language carries the explanation, the transliteration, and the meaning.</p>
    </div>
  </section>

  <!-- ============ 2. PROFILE ============ -->
  <section class="screen" id="s-profile">
    <div class="scroll">
      <button class="back" id="toLang">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        <span id="backLbl"></span>
      </button>
      <div class="onb-head">
        <div class="steps"><i class="done"></i><i class="done"></i></div>
        <h1 class="display" id="pTitle"></h1>
        <p id="pLead"></p>
      </div>
      <div class="arches">
        <button class="arch" data-persona="child">
          <div class="p-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3a8 8 0 1 0 7 11.5A9 9 0 0 1 14 3z"/></svg></div>
          <span class="p-ar">طفل</span><span class="p-en" data-p="child"></span>
        </button>

/* ============================================================
   PRAYER ARC — the signature element
   ============================================================ */
const PRAYERS = [
  { ar:'الفجر',   t:'5:02' },
  { ar:'الظهر',   t:'12:58' },
  { ar:'العصر',   t:'16:31' },
  { ar:'المغرب',  t:'19:47' },
  { ar:'العشاء',  t:'21:12' },
];
const NOW_I = 2;        // demo: between Dhuhr and Asr, Asr is next
const NOW_FRAC = 0.62;  // progress through the current interval

function drawArc(){
  const svg = document.getElementById('arcSvg');
  const W = 320, H = 56, pad = 18;
  const n = PRAYERS.length;
  const x = i => pad + (W - pad*2) * (i/(n-1));
  const y = i => { const t = i/(n-1); return H - 8 - Math.sin(t*Math.PI)*26; };

  // smooth path through the stations
  let d = `M ${x(0)} ${y(0)}`;
  for (let i=0;i<n-1;i++){
    const cx = (x(i)+x(i+1))/2;
    d += ` Q ${cx} ${y(i)} ${cx} ${(y(i)+y(i+1))/2} T ${x(i+1)} ${y(i+1)}`;
  }
  // position of "now" between station NOW_I-1 and NOW_I
  const a = Math.max(0, NOW_I-1), b = NOW_I;
  const nx = x(a) + (x(b)-x(a))*NOW_FRAC;
  const ny = y(a) + (y(b)-y(a))*NOW_FRAC;

  let dots = '';
  for (let i=0;i<n;i++){
    const passed = i < NOW_I;
    dots += `<circle cx="${x(i)}" cy="${y(i)}" r="${i===NOW_I?5.5:4}"
      fill="${passed?'var(--accent)':'var(--surface)'}"
      stroke="${i===NOW_I?'var(--gold)':'var(--accent)'}"
      stroke-width="${i===NOW_I?2.5:1.8}" opacity="${i>NOW_I?0.45:1}"/>`;
  }

  svg.innerHTML = `
    <path d="${d}" fill="none" stroke="var(--line)" stroke-width="2" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"
          stroke-dasharray="1000" stroke-dashoffset="${1000 - 1000*((NOW_I-1+NOW_FRAC)/(n-1))*0.98}" opacity=".85"/>
    ${dots}
    <g>
      <line x1="${nx}" y1="${ny-13}" x2="${nx}" y2="${ny+9}" stroke="var(--gold)" stroke-width="1.5" opacity=".55"/>
      <circle cx="${nx}" cy="${ny}" r="3.4" fill="var(--gold)"/>
    </g>`;

  document.getElementById('arcLabels').innerHTML =
    PRAYERS.map((p,i)=>`<span class="${i===NOW_I?'is-now':''}">${p.t}</span>`).join('');
  document.getElementById('arcName').textContent = PRAYERS[NOW_I].ar;
}

/* ============================================================
   SOURCES (Rashed)
   ============================================================ */
const SITES = [
  { n:'موقع الشيخ ابن باز',    d:'binbaz.org.sa' },
  { n:'الإسلام سؤال وجواب',    d:'islamqa.info' },
  { n:'إسلام ويب',             d:'islamweb.net' },
  { n:'موقع الشيخ ابن عثيمين', d:'binothaimeen.net' },
];
const CANNED = {
  'فضل صيام يوم عرفة':{
    ar:'صيام يوم عرفة سنة مؤكدة لغير الحاجّ، وقد أخبر النبي ﷺ أنه يُكفّر ذنوب سنة ماضية وسنة قادمة (رواه مسلم). أما الحاجّ الواقف بعرفة فلا يُشرع له صومه. وهذا ملخّص، والتفصيل عند أهل العلم:',
    en:'Fasting the Day of Arafah is a confirmed sunnah for those not on Hajj; the Prophet ﷺ said it expiates the past year and the coming year (Muslim). A pilgrim standing at Arafah does not fast it. This is a summary — the detail is with the scholars:'
  }
};

/* ============================================================
   STATE
   ============================================================ */
let lang='en', persona='new', chatReady=false;
const app = document.getElementById('app');
const $ = id => document.getElementById(id);
const S = { lang:$('s-lang'), profile:$('s-profile'), home:$('s-home'), chat:$('s-chat') };
function go(name){ Object.values(S).forEach(s=>s.classList.remove('on')); S[name].classList.add('on'); }

function setTheme(t){
  app.dataset.theme = t;
  $('thDay').classList.toggle('on', t==='day');
  $('thNight').classList.toggle('on', t==='night');
}

/* build language list */
$('langList').innerHTML = LANGS.map(l=>`
  <button class="choice" data-lang="${l.id}">
    <span class="mark ${l.id==='ar'?'ar':''}">${l.mark}</span>
    <span><span class="t1">${l.native}</span><span class="t2">${l.hint}</span></span>
    <span class="arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
  </button>`).join('');

function applyProfileStrings(){
  const t = T[lang];
  app.setAttribute('dir', t.dir);
  $('backLbl').textContent = t.back;
  $('pTitle').textContent = t.pTitle;
  $('pLead').textContent = t.pLead;
  $('pFoot').textContent = t.pFoot;
  document.querySelectorAll('[data-p]').forEach(el=>el.textContent = t[el.dataset.p]);
}

function tileHTML(key){
  const f = F[key], t = T[lang];
  const [name, desc] = t.tiles[key];
  return `<button class="tile ${f.span?'span2':''} ${f.lead?'lead':''}" data-key="${key}">
    <span class="t-ic">${I[f.ic]}</span>
    <span class="t-ar">${f.ar}</span>
    <span><span class="t-name">${name}</span><span class="t-desc">${desc}</span></span>
  </button>`;
}

function renderHome(){
  const t = T[lang];
  app.dataset.persona = persona;
  $('greetSub').textContent = t['greet'+persona.charAt(0).toUpperCase()+persona.slice(1)];
  $('arcSub').textContent = t.arcSub;
  $('arcIn').innerHTML = `${t.arcIn} <b>1:05</b>`;
  $('labContinue').textContent = t.labContinue;
  $('labPractice').textContent = t.labPractice;
  $('labDaily').textContent = t.labDaily;
  $('resumeT1').textContent = t.resumeT1;
  $('resumeT2').textContent = t.resumeT2;
  $('resumeSec').style.display = persona==='adult' ? 'none' : '';
  document.querySelectorAll('[data-nav]').forEach(el=>el.textContent = t.nav[el.dataset.nav]);

  $('tilesPractice').innerHTML = P[persona].practice.map(tileHTML).join('');
  $('tilesDaily').innerHTML    = P[persona].daily.map(tileHTML).join('');
  document.querySelectorAll('.tile').forEach(el=>{
    el.addEventListener('click', ()=>{ if (F[el.dataset.key].go === 'chat') openChat(); });
  });

  // settings sheet labels
  $('setTitle').textContent = t.setTitle;
  $('setTheme').textContent = t.setTheme;
  $('setLang').textContent = t.setLang;
  $('setProfile').textContent = t.setProfile;
  $('thDay').textContent = t.day;
  $('thNight').textContent = t.night;
  $('setLangBtn').textContent = LANGS.find(l=>l.id===lang).native;
  $('setProfBtn').textContent = t[persona];

  drawArc();
}

/* ---------- Rashed ---------- */
function bubble(cls, html){
  const d = document.createElement('div');
  d.className = 'bubble ' + cls; d.innerHTML = html;
  $('chatBody').appendChild(d);
  $('chatBody').scrollTop = $('chatBody').scrollHeight;
}
function sourcesHTML(q){
  const t = T[lang];
  const list = SITES.map(s=>`
    <a class="src" href="https://www.google.com/search?q=site:${s.d}+${encodeURIComponent(q)}" target="_blank" rel="noopener">
      <span class="s-i">${s.d[0].toUpperCase()}</span>
      <span><span class="s-n">${s.n}</span><span class="s-d">${s.d}</span></span>
      <span class="s-g">↗</span>
    </a>`).join('');
  return `<div class="srcs"><span class="lab">${t.srcLab}</span>${list}</div><div class="fine">${t.fine}</div>`;
}
function ask(q){
  if(!q.trim()) return;
  const t = T[lang];
  bubble('me', `<span class="ar">${q}</span>`);
  $('chatChips').style.display = 'none';
  const c = CANNED[q.trim()];
  const intro = c ? (lang==='ar'? c.ar : c.en) : t.reply;
  setTimeout(()=>bubble('bot', `<div>${intro}</div>${sourcesHTML(q)}`), 380);
}
function openChat(){
  const t = T[lang];
  $('chatRole').textContent = t.chatRole;
  $('chatIn').placeholder = t.ph;
  if(!chatReady){
    bubble('bot', t.greeting);
    $('chatChips').innerHTML = '';
    ['فضل صيام يوم عرفة','كيف أتوضأ؟','ما أركان الإسلام؟'].forEach(q=>{
      const b=document.createElement('button'); b.className='chip'; b.textContent=q;
      b.addEventListener('click',()=>ask(q)); $('chatChips').appendChild(b);
    });
    chatReady = true;
  }
  $('chatChips').style.display = chatReady && $('chatBody').children.length>1 ? 'none' : 'flex';
  go('chat');
}

/* ============================================================
   WIRING
   ============================================================ */
document.querySelectorAll('[data-lang]').forEach(b=>{
  b.addEventListener('click',()=>{ lang=b.dataset.lang; applyProfileStrings(); go('profile'); });
});
document.querySelectorAll('.arch').forEach(b=>{
  b.addEventListener('click',()=>{ persona=b.dataset.persona; renderHome(); go('home'); });
});
$('toLang').addEventListener('click',()=>go('lang'));
$('fabRashed').addEventListener('click', openChat);
$('fabRashed').addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();openChat();} });
$('chatClose').addEventListener('click',()=>go('home'));
$('chatSend').addEventListener('click',()=>{ ask($('chatIn').value); $('chatIn').value=''; });
$('chatIn').addEventListener('keydown',e=>{ if(e.key==='Enter'){ ask(e.target.value); e.target.value=''; } });
document.querySelectorAll('.tabbar button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.tabbar button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
  });
});

/* settings sheet */
function sheet(open){ $('sheet').classList.toggle('on',open); $('sheetBg').classList.toggle('on',open); }
$('openSheet').addEventListener('click',()=>sheet(true));
$('sheetBg').addEventListener('click',()=>sheet(false));
document.querySelectorAll('[data-theme-set]').forEach(b=>{
  b.addEventListener('click',()=>setTheme(b.dataset.themeSet));
});
$('setLangBtn').addEventListener('click',()=>{ sheet(false); go('lang'); });
$('setProfBtn').addEventListener('click',()=>{ sheet(false); applyProfileStrings(); go('profile'); });

/* theme follows the hour: night before Fajr and after Maghrib */
(function initTheme(){
  const h = new Date().getHours();
  setTheme((h >= 19 || h < 5) ? 'night' : 'day');
})();
drawArc();
